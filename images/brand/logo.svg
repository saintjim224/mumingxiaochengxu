<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- 渐变与滤镜定义 -->
    <linearGradient id="rtBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0e2444"/>
      <stop offset="100%" stop-color="#061122"/>
    </linearGradient>
    <linearGradient id="rtBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="rtMtnBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rtMtnFrontLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="rtMtnFrontDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="rtSnowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbe5fe"/>
    </linearGradient>
    <linearGradient id="rtOrbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rtWind" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="rtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 外轮廓底盾 (Squircle Badge) -->
  <rect x="2" y="2" width="96" height="96" rx="24" ry="24" fill="url(#rtBgGrad)" stroke="url(#rtBorderGrad)" stroke-width="2"/>

  <!-- 遥感雷达探测波纹 (Concentric Radar Rings) -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 背景雪山 (高原远山) -->
  <polygon points="18,74 38,42 56,74" fill="url(#rtMtnBack)" opacity="0.9"/>
  <!-- 远山积雪 -->
  <polygon points="38,42 43,50 39,48 35,51" fill="#e0f2fe" opacity="0.8"/>

  <!-- 主体雪山 - 阴影面 (右侧) -->
  <polygon points="52,28 78,74 55,74" fill="url(#rtMtnFrontDark)"/>
  <!-- 主体雪山 - 光照面 (左侧) -->
  <polygon points="52,28 55,74 28,74" fill="url(#rtMtnFrontLight)"/>

  <!-- 主峰雪冠 (Snowcap) -->
  <polygon points="52,28 58,42 54,39 50,43 45,39 42,43" fill="url(#rtSnowLight)"/>
  <polygon points="52,28 58,42 54,39 52,43" fill="#ffffff"/>

  <!-- 气象时空流动风带 (Wind streamlines) -->
  <path d="M14 78 Q 36 71 58 77 T 86 75" fill="none" stroke="url(#rtWind)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M22 83 Q 48 78 78 82" fill="none" stroke="url(#rtWind)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 环形卫星多源时空监测轨道 (Satellite Orbit) -->
  <path d="M16 66 C 18 42, 54 22, 82 34" fill="none" stroke="url(#rtOrbit)" stroke-width="2.2" stroke-linecap="round" filter="url(#rtGlow)"/>
  <path d="M82 34 C 88 37, 86 46, 76 54 C 64 64, 42 70, 24 68" fill="none" stroke="url(#rtOrbit)" stroke-width="1.4" stroke-dasharray="2 3" stroke-linecap="round" opacity="0.5"/>

  <!-- 轨道卫星与高能信号脉冲 (Weather Satellite & Pulse Beacon) -->
  <circle cx="82" cy="34" r="4.5" fill="#00e5ff" filter="url(#rtGlow)"/>
  <circle cx="82" cy="34" r="2.2" fill="#ffffff"/>
  <!-- 卫星微型探测羽翼 -->
  <line x1="78" y1="32" x2="86" y2="36" stroke="#ffffff" stroke-width="1" opacity="0.9"/>

  <!-- 主峰顶微光脉冲 (Peak Summit Sparkle) -->
  <circle cx="52" cy="28" r="1.8" fill="#ffffff" filter="url(#rtGlow)"/>
</svg>
